name: Release (npm publish)

on:
  push:
    tags: ["v*"]

# Serialize publishes per tag so two runs can never race the same version
# (npm provenance "staging" + a second run = E409 Cannot publish over staged version).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"
      - run: npm ci
      # Gate the publish on the same drift guard CI uses.
      - run: npm run verify
      # Idempotent: skip if this version is already on the registry (safe re-runs).
      - name: Publish to npm (if new)
        run: |
          VER=$(node -p "require('./package.json').version")
          if npm view "@agentkiko/kikobooks-mcp-server@${VER}" version >/dev/null 2>&1; then
            echo "Version ${VER} already published; skipping."
          else
            npm publish --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
